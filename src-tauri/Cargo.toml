[package]
name = "quanta-protocol"
version = "3.13.1"
# Two binaries live in this package: the Tauri desktop app (`quanta-protocol`,
# from src/main.rs) and the headless daemon (`quanta-node`, src/bin/quanta-node.rs).
# `default-run` tells a bare `cargo run` (used by `tauri dev`) which one to launch,
# so adding the daemon doesn't break the app's dev/run flow.
default-run = "quanta-protocol"
description = "Quanta Protocol — sovereign peer-to-peer web and value network (coin: QUANTA)"
authors = ["Quanta Protocol Contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nobodyohm-web/Torus"
readme = "../README.md"

[lib]
name = "quanta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ─── Tauri ───
tauri = { version = "2", features = [] }

# ─── Serialization ───
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Async ───
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"

# ─── P2P (Iroh / Willow / QUIC) ───
# PQ-TRANSPORT-1 (2026-07-18): la couche de transport négocie désormais un
# échange de clés **hybride post-quantique** `X25519MLKEM768` (défense contre
# « harvest-now-decrypt-later » sur le canal QUIC). Cela impose de basculer le
# fournisseur cryptographique de rustls de `ring` vers `aws-lc-rs` (seul à
# fournir ML-KEM-768), d'où `default-features = false` + `tls-aws-lc-rs` en
# remplacement du `tls-ring` par défaut. Les autres features par défaut d'iroh
# 0.98 (`metrics`, `fast-apple-datapath`, `portmapper`) sont conservées à
# l'identique — aucun changement de comportement relay/discovery/gossip.
# ⚠️ Limite connue : l'**identité de nœud** (NodeId) reste Ed25519 — Iroh
# attend un consensus d'industrie sur la signature PQ des EndpointIds ; on
# bascule le jour où c'est livré (dette upstream, cf. CLAUDE.md).
iroh = { version = "0.98", default-features = false, features = [
    "metrics",
    "fast-apple-datapath",
    "portmapper",
    "tls-aws-lc-rs",
    # RDV-1 — address lookup over the mainline BitTorrent DHT (pkarr records).
    # Publishes this endpoint's address under its own EndpointId, so a ticket
    # stays reachable across NAT/IP changes without depending on the n0 relays,
    # and resolves a known EndpointId without any server we own.
    "address-lookup-pkarr-dht",
] }
iroh-gossip = "0.98"

# RDV-1 — the same mainline DHT, used directly for the piece iroh does NOT
# provide: **rendezvous by topic**. `DhtAddressLookup` resolves an EndpointId we
# already know; it cannot answer "who else runs Quanta?". We publish/read that
# on BEP-44 mutable slots derived from the gossip topic (see `p2p/rendezvous.rs`).
# Version pinned to what iroh 0.98 itself depends on — one DHT crate in the tree.
mainline = "6"

# PQ-TRANSPORT-1 — rustls en dépendance **directe** uniquement pour activer la
# feature `prefer-post-quantum`, qui fait préférer `X25519MLKEM768` dans la
# poignée de main TLS 1.3 sous-jacente à QUIC. `default-features = false` :
# l'unification de features de Cargo réunit ceci avec les features rustls
# qu'iroh exige déjà (additif — on n'éteint rien), on ne fait qu'**ajouter** la
# préférence PQ. Version alignée sur le rustls 0.23.x déjà verrouillé par iroh.
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
] }

# ─── Hashing (BLAKE3 — 10 Go/s verified streaming) ───
blake3 = "1.8"

# ─── Classical Crypto (Ed25519) ───
# C6: `zeroize` wipes the Ed25519 SigningKey's secret scalar on drop (FIPS-204
# ML-DSA keys already zeroize by default), so the signing secret held by
# CryptoEngine / sm::Node is erased from memory when dropped (Constitution §3).
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }

# ─── Symmetric Encryption (AES-256-GCM) ───
aes-gcm = "0.10"

# ─── Key Derivation (Argon2id) ───
argon2 = "0.5"

# ─── Memory Safety (zeroize on drop) ───
zeroize = { version = "1.8", features = ["derive"] }

# ─── Database (libSQL — SQLite + F32_BLOB vectors) ───
# AUDIT-2026-07-25 — the database is opened with `Builder::new_local`, so the
# remote/replication stack (hyper-rustls -> rustls 0.22 -> rustls-webpki 0.102)
# is compiled but never exercised. Dropping default features removes four
# RUSTSEC advisories from the tree that only ever applied to dead code.
libsql = { version = "0.9", default-features = false, features = ["core"] }

# ─── Random ───
rand = "0.8"

# ─── Encoding ───
hex = "0.4"
# BIP39 mnemonic (RECOVER-1): the 32-byte ML-DSA fund seed ⇄ a 24-word recovery
# phrase — the industry-standard wallet backup, far more robust to transcribe than
# 64 hex chars. `default-features = false` + `std` keeps only the English wordlist.
# AUDIT-2026-07-25 — the 24-word phrase IS the fund-controlling secret
# (RECOVER-1). Without the `zeroize` feature the `Mnemonic` kept the words
# in memory after use, so the one secret that can move every coin outlived
# its scope. The feature derives Zeroize + ZeroizeOnDrop on Mnemonic.
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }

# ─── Identifiers ───
uuid = { version = "1", features = ["v4"] }

# ─── Time ───
chrono = { version = "0.4", features = ["serde"] }

# ─── Logging ───
log = "0.4"
env_logger = "0.11"

# ─── Platform Dirs ───
dirs = "6"

# ─── Cryptographie Post-Quantique — NIST FIPS 204 (ML-DSA-65) ───
# Activé le 2026-05-31. `fips204` est pur Rust, constant-time, sans `unsafe`,
# et SANS dépendance ed25519 → aucun conflit avec ed25519-dalek v2 (c'était le
# blocage documenté en Phase 2A). La paire ML-DSA-65 est dérivée de façon
# déterministe depuis la graine Ed25519 (XOF BLAKE3) → zéro migration de vault.
# Voir security/hybrid_crypto.rs.
fips204 = "0.4.6"
rand_core = "0.6"

# ─── Phase 2B : Consensus CRDT ───────────────────────────────────
crdts = "7"        # G-Counter, PN-Counter, OR-Set, LWW-Register
num-traits = "0.2" # ToPrimitive pour convertir BigInt/BigUint des CRDTs en i64/u64

# ─── Phase 2C : Mesure énergie CPU réelle ────────────────────────
sysinfo = "0.33"   # CPU usage pour calcul watts réel
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# NET-8: Optional ChainSegment compression (gzip via miniz pure-Rust backend).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# ─── Tests ────────────────────────────────────────────────────────
# ─── macOS Keychain (Touch ID–gated quick unlock, security/biometric.rs) ───
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# App Nap opt-out (node_runtime::prevent_app_nap) — same version Tauri already
# carries transitively, so this adds no new build unit family.
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
# NSWindow.occlusionState (guardian.rs) — the ONLY truthful "is macOS throttling
# this window" signal (minimized ∪ hidden ∪ fully occluded by another window).
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }

[dev-dependencies]
proptest = "1"     # Property-based testing for invariants (Shapley, ledger overflow)
