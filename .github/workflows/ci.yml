name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]

# AUDIT-2026-07-25 — least privilege, stated explicitly rather than inherited
# from the repository default: CI only builds and tests, it never writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust — test · clippy
    runs-on: ubuntu-latest
    steps:
      # AUDIT SC-01 — toutes les actions sont épinglées par SHA de commit complet.
      # Un tag (`@v4`) et a fortiori une branche (`@stable`) sont mutables : un
      # compromis amont réécrit le code exécuté sur le runner sans changer une
      # ligne de ce dépôt. Le SHA est immuable ; le commentaire porte la version
      # lisible et permet à Dependabot (.github/dependabot.yml) de proposer le bump.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branche stable @ 2026-08-05
        with:
          # Épinglé par SHA, le nom de ref ne porte plus la version : l'entrée
          # `toolchain` doit être explicite, sinon le toolchain devient implicite.
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # AUDIT SC-11 — `--locked` : sans lui, Cargo réécrit silencieusement
      # Cargo.lock sur le runner si le manifeste a dérivé, et la CI valide alors
      # une résolution de dépendances que personne n'a revue. Avec `--locked`,
      # tout écart lockfile/manifeste échoue au lieu d'être absorbé.
      - name: Cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Cargo clippy (deny warnings)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  supply-chain:
    name: Supply-chain — cargo-deny · cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branche stable @ 2026-08-05
        with:
          toolchain: stable
      # AUDIT SC-02 — porte BLOQUANTE. cargo-deny couvre advisories RustSec
      # (vulnerability + unmaintained + unsound), licences, sources et doublons.
      # deny.toml déclare désormais explicitement les trois classes : la seule
      # façon de faire passer un advisory est un `ignore` daté et justifié.
      - name: cargo-deny (advisories · licenses · sources · bans)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
      # AUDIT SC-02 — second regard SANS liste d'ignore : cargo-deny ne montre
      # que ce qui n'est pas trié, cargo audit montre l'état brut de l'arbre.
      # Non bloquant à dessein (les advisories transitives verrouillées en amont
      # bloqueraient toute la CI) : sert de contrôle anti-dérive du triage de
      # deny.toml, visible dans les logs de chaque run.
      - name: Installer cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo-audit (sans filtre — visibilité brute de l'arbre)
        continue-on-error: true
        run: cargo audit --file src-tauri/Cargo.lock

  frontend:
    name: Frontend — audit · svelte-check · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # AUDIT SC-08 — la chaîne de build npm tourne sur la machine qui détient la
      # clé de signature updater (SC-01) : une dépendance de build compromise y
      # est une compromission de la racine de confiance. Seuil `high` : bloque
      # sans transformer chaque advisory `low` transitoire en CI rouge.
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Type-check (svelte-check)
        run: npm run check
      - run: npm run build
