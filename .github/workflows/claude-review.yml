name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

# AUDIT SC-01/SC-10 — aucun droit par defaut au niveau du workflow : ce workflow
# tourne dans le contexte du depot de base avec les secrets, sur du contenu
# controle par l'exterieur. Chaque job doit declarer ses droits explicitement.
permissions: {}

jobs:
  review:
    # AUDIT-2026-07-25 — `issue_comment` runs in the BASE repo context, with the
    # repo's secrets, and this is a public repository. Without an author check,
    # anyone commenting "@claude" on any issue triggered a job holding write
    # permission — the classic pwn-request shape. Restrict the comment trigger to
    # people who already have write access to the repo.
    if: |
      github.event_name == 'pull_request' ||
      (contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    # A review reads code and writes comments. It never needs to write to the
    # repository itself, so `contents` drops to read: even a compromised run
    # cannot push to a branch.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # AUDIT SC-01 — actions epinglees par SHA de commit complet : ce job recoit
      # ANTHROPIC_API_KEY et des droits d'ecriture sur les PR/issues ; un tag
      # mutable repointe en amont s'executerait avec ces droits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The review needs the ANTHROPIC_API_KEY repo secret. When it is absent,
      # skip gracefully instead of failing the required check.
      - name: Check API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY secret not set — Claude review skipped."
          fi
      - name: Claude Code Review
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sonnet pour les reviews de routine (rapide + économique)
          # Pour un audit profond, commenter "@claude-opus" dans la PR
          claude_args: --model ${{ contains(github.event.comment.body, '@claude-opus') && 'claude-opus-4-8' || 'claude-sonnet-5' }}
          prompt: |
            You are reviewing the QUANTA protocol — a sovereign P2P cryptocurrency
            (post-quantum accounts, PoS consensus with a Casper-FFG-style finality
            gadget, energy-measured mining). Read CLAUDE.md for full project context.

            Review this PR and check:
            1. Rust safety: no unwrap() in production, zeroize all secrets, tokio::sync only
            2. Svelte 5: runes only ($state, $derived, $effect, $props)
            3. Crypto-only scope: NO web/social features (sites, feeds, forums, marketplace)
            4. Economic model: HARD CAP 100M QUANTA (MAX_SUPPLY_MICRO), decreasing
               front-loaded emission (MAX − minted)/EMISSION_DIVISOR enforced at
               consensus (validate_block_emission), 1% transfer burn, zero premine.
               Reject any change that weakens the cap or the per-block emission bound.
            5. Security: tx authority = ML-DSA-65 (FIPS 204) key bound to the sender
               address (BLAKE3); Ed25519 = gossip transport envelopes only; Argon2id
               for KDF; opaque errors; no secrets in logs.
            6. Consensus core (src-tauri/src/sm/): sans-IO determinism — no wall
               clock, no OsRng, no HashMap iteration order in consensus verdicts;
               conservation invariant Σ(spendable+staked+unbonding)+burned == minted.
            7. Code quality: idiomatic Rust, proper error handling, no dead code
               (clippy --all-targets -D warnings must pass).

            Post inline comments on specific lines where issues are found.
            Approve if the code meets all criteria. Request changes otherwise.
