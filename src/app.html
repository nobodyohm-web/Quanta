<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="QUANTA — Sovereign Value Network. Your money. Your network. Your sovereignty." />
    <!-- Fonts are bundled locally (@fontsource-variable, imported in +page.svelte).
         No CDN, no external fetch — the app is fully offline (frontend rule #7). -->
    <title>QUANTA</title>
    <!-- A13 — anti-flash de thème : pose data-theme AVANT le premier paint (lit
         les prefs localStorage, résout "auto" via matchMedia). Le code est
         EXTERNE et non inline : la CSP en mode `hash` ne connaît que les scripts
         générés par SvelteKit, donc un inline écrit ici serait refusé. Servi par
         l'origine, il passe par `'self'` sans hash à maintenir. Balise synchrone :
         elle s'exécute avant le premier paint. -->
    <script src="%sveltekit.assets%/theme-boot.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
