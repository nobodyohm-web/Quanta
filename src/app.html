<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="QUANTA — Sovereign Value Network. Your money. Your network. Your sovereignty." />
    <!-- Fonts are bundled locally (@fontsource-variable, imported in +page.svelte).
         No CDN, no external fetch — the app is fully offline (frontend rule #7). -->
    <title>QUANTA</title>
    <!-- Anti-flash de thème : pose data-theme AVANT le premier paint (lit les
         prefs localStorage, résout "auto" via matchMedia). Défaut marque = clair
         si rien de stocké. On peint aussi le fond immédiatement (le bundle CSS
         arrive après ce script) pour éviter tout flash blanc en mode sombre. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("quanta.prefs.v1") || localStorage.getItem("titan.prefs.v1");
          var theme = raw ? (JSON.parse(raw).theme || "light") : "light";
          if (theme === "auto") {
            theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
          }
          if (theme !== "dark" && theme !== "light") theme = "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.backgroundColor = theme === "dark" ? "#0f1115" : "#ffffff";
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
