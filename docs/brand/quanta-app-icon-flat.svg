<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!-- Quanta app icon — FLAT variant for ≤64px rasters (favicon, badges).
       No gradient (muddy when small): teal-700 #087F8C mark on white squircle,
       higher contrast. The Aurora master (quanta-app-icon.svg) is for ≥128px. -->
  <rect width="1024" height="1024" rx="229" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="227.5" fill="none" stroke="#0b4a50" stroke-opacity="0.10" stroke-width="3"/>
  <g transform="translate(64 64) scale(18)">
    <circle cx="24" cy="24" r="15" stroke="#087F8C" stroke-width="4.4"/>
    <rect x="28.107" y="31.207" width="13" height="6.8" rx="1.6" transform="rotate(45 34.607 34.607)" fill="#087F8C"/>
  </g>
</svg>
