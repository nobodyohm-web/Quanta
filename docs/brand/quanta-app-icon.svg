<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!-- Quanta app icon — « l'anneau et le quantum », v14 (The Sealed Ring).
       Light-theme, deliberately anti-crypto-dark: WHITE squircle ground,
       teal-DOMINANT Aurora ring (indigo/violet only kiss the SE tail = where
       finality happens), a soft jewel bloom at the sealing crossing.
       Mark = 48u geometry, translate(64 64) scale(18): R=270, w=99, crossing 687.
       Regenerate rasters:
         qlmanage -t -s 1024 -o /tmp docs/brand/quanta-app-icon.svg
         npx tauri icon /tmp/quanta-app-icon.svg.png -->
  <defs>
    <linearGradient id="aur" x1="185" y1="185" x2="835" y2="835" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14C8B8"/>
      <stop offset="0.45" stop-color="#0BA5A0"/>
      <stop offset="0.72" stop-color="#087F8C"/>
      <stop offset="0.90" stop-color="#3D6FE0"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.75">
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b4a50" stop-opacity="0.04"/>
    </radialGradient>
    <radialGradient id="jewel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14C8B8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#14C8B8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="229" fill="#ffffff"/>
  <rect width="1024" height="1024" rx="229" fill="url(#vig)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="227.5" fill="none" stroke="#0b4a50" stroke-opacity="0.10" stroke-width="3"/>
  <circle cx="687" cy="687" r="150" fill="url(#jewel)"/>
  <g transform="translate(64 64) scale(18)">
    <path d="M27.882 38.489 A15 15 0 1 1 38.489 27.882" stroke="url(#aur)" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="30.364" y1="30.364" x2="38.849" y2="38.849" stroke="url(#aur)" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
